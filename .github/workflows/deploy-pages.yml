name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar paginas Copy code (extraer y comparar)
        run: |
          for page in public/extraer/index.html public/comparar/index.html; do
            if ! grep -q 'id="extractor-code"' "$page"; then
              echo "Falta el script embebido en $page"
              exit 1
            fi
            if ! grep -q 'type="application/json">"' "$page"; then
              echo "$page no tiene el bundle. En local ejecuta: bun run build"
              exit 1
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: URLs publicadas
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "Extraer:    ${BASE}/extraer/"
          echo "Comparar:   ${BASE}/comparar/"
          echo "Analizador: ${BASE}/analizador/"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
