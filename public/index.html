<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguidores Scraper</title>
  <link rel="icon" href="assets/logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111;
      --surface: #1c1c1c;
      --surface-raised: #252525;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --bar-bg: #f4f4f5;
      --bar-text: #18181b;
      --radius: 1rem;
      --radius-pill: 999px;
      --column: min(540px, 100%);
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 400;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      padding: 2.5rem 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100%;
      max-width: 980px;
      gap: 2.25rem;
    }

    .container header {
      width: var(--column);
      text-align: center;
      padding-bottom: 0.25rem;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-text__main {
      display: inline-flex;
      align-items: baseline;
      gap: 0.4em;
      font-size: clamp(1.875rem, 5.5vw, 2.625rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: var(--text);
      white-space: nowrap;
    }

    .logo-text__version {
      font-size: 0.42em;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-muted);
    }

    .logo-text__sub {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .hub {
      display: flex;
      width: var(--column);
      flex-direction: column;
      gap: 1rem;
      align-items: stretch;
    }

    .hub__hint {
      border-radius: var(--radius-pill);
      margin: 0;
      background: var(--bar-bg);
      padding: 1rem 1.35rem;
      color: var(--bar-text);
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
    }

    .hub__link {
      padding: 0.875rem 1.25rem;
      width: 100%;
      color: var(--text);
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .hub__link-inner {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      line-height: 1;
    }

    .hub__link:hover {
      background-color: var(--surface-raised);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .hub__link:active {
      transform: translateY(1px);
    }

    .hub__link svg {
      display: block;
      flex-shrink: 0;
      width: 1.375rem;
      height: 1.375rem;
    }

    .hub__link-label {
      display: block;
      white-space: nowrap;
    }

    .hub__back-spacer {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-text">
        <span class="logo-text__main">Seguidores Scraper<span class="logo-text__version"></span></span>
        <span class="logo-text__sub">Seguidores - Seguidos</span>
      </div>
    </header>

    <nav class="hub" aria-label="Scripts disponibles">
      <span class="hub__back-spacer" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M19 12H5m0 0l6 6m-6-6l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Volver
      </span>

      <p class="hub__hint">Elige una ruta: extraer, comparar o analizar.</p>

      <a class="hub__link" data-route="extraer" href="extraer/">
        <span class="hub__link-inner">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 3v12m0 0l4-4m-4 4l-4-4M4 21h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="hub__link-label">Extraer</span>
        </span>
      </a>

      <a class="hub__link" data-route="comparar" href="comparar/">
        <span class="hub__link-inner">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7 7h10M7 12h6M7 17h8M5 4h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="hub__link-label">Comparar</span>
        </span>
      </a>

      <a class="hub__link" data-route="analizador" href="analizador/">
        <span class="hub__link-inner">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="hub__link-label">Analizador</span>
        </span>
      </a>
    </nav>
  </div>
  <script>
    (function () {
      var isFile = location.protocol === 'file:';
      document.querySelectorAll('[data-route]').forEach(function (link) {
        var route = link.getAttribute('data-route');
        link.href = isFile ? route + '/index.html' : route + '/';
      });
    })();
  </script>
  <script src="assets/version-badge.js"></script>
</body>
</html>
