<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguidores Scraper - Extraer</title>
  <link rel="icon" href="../assets/logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111;
      --surface: #1c1c1c;
      --surface-raised: #252525;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-subtle: #71717a;
      --bar-bg: #f4f4f5;
      --bar-text: #18181b;
      --radius: 1rem;
      --radius-pill: 999px;
      --column: min(540px, 100%);
      --border: rgba(255, 255, 255, 0.08);
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 400;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      padding: 2.5rem 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100%;
      max-width: 980px;
      gap: 2.25rem;
    }

    .container header {
      width: var(--column);
      text-align: center;
      padding-bottom: 0.25rem;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-text__main {
      display: inline-flex;
      align-items: baseline;
      gap: 0.4em;
      font-size: clamp(1.875rem, 5.5vw, 2.625rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: var(--text);
      white-space: nowrap;
    }

    .logo-text__version {
      font-size: 0.42em;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-muted);
    }

    .logo-text__sub {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .codeBox__wrapper {
      display: flex;
      width: var(--column);
      flex-direction: column;
      gap: 1rem;
      align-items: stretch;
    }

    .codeBox {
      width: 100%;
      user-select: none;
    }

    pre {
      border-radius: var(--radius-pill);
      overflow: hidden !important;
      margin: 0;
      background: var(--bar-bg);
      padding: 0;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
    }

    .codeBox pre {
      overflow: hidden;
    }

    code,
    .status-text {
      display: block;
      padding: 1rem 1.35rem;
      color: var(--bar-text);
      font-family: inherit !important;
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.5;
      white-space: normal;
      overflow-wrap: break-word;
      user-select: none;
      pointer-events: none;
      text-align: center;
    }

    .copy-button {
      padding: 0.875rem 1.25rem;
      width: 100%;
      color: var(--text);
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .copy-button:hover:not(:disabled) {
      background-color: var(--surface-raised);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .copy-button:disabled {
      opacity: 0.45;
      cursor: wait;
    }

    .copy-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .copy-button svg {
      flex-shrink: 0;
      opacity: 0.95;
    }

    .page-action {
      padding: 0.875rem 1.25rem;
      width: 100%;
      color: var(--text);
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .page-action:hover {
      background-color: var(--surface-raised);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .page-action:active {
      transform: translateY(1px);
    }

    .page-action svg {
      flex-shrink: 0;
      opacity: 0.95;
    }

    .page-action--muted {
      color: var(--text-muted);
      font-size: 0.9375rem;
    }

    .page-action--back {
      width: auto;
      align-self: flex-start;
      padding: 0.5rem 0.875rem;
      font-size: 0.875rem;
      font-weight: 500;
      gap: 0.35rem;
    }

    .page-action--back svg {
      width: 16px;
      height: 16px;
    }

    .page-action--docs {
      margin-top: 0.25rem;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      color: var(--text);
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      background: rgba(17, 17, 17, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 1.5rem;
    }

    .confirm-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .confirm-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      max-width: 400px;
      width: 100%;
      padding: 1.75rem 1.5rem 1.5rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      transform: scale(0.96) translateY(6px);
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }

    .confirm-overlay.show .confirm-box {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .confirm-box__icon {
      width: 56px;
      height: 56px;
      margin-bottom: 1rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.28);
      transform: scale(0.85);
      opacity: 0;
    }

    .confirm-overlay.show .confirm-box__icon {
      animation: confirm-icon-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.08s forwards;
    }

    @keyframes confirm-icon-in {
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .confirm-box__icon svg {
      width: 28px;
      height: 28px;
    }

    .confirm-box__header__text {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 1.25rem;
    }

    .confirm-box__close {
      width: 100%;
    }

    .confirm-box__close button {
      padding: 0.75rem 1.25rem;
      width: 100%;
      background-color: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .confirm-box__close button:hover {
      background-color: #2e2e2e;
      border-color: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>

  <script>
    let instagramScript = '';

    async function cargarScriptExtractor() {
      const payload = document.getElementById('extractor-code');
      if (payload && payload.textContent.trim()) {
        return JSON.parse(payload.textContent);
      }
      return '';
    }

    function mostrarEstadoListo() {
      const codeEl = document.getElementById('code');
      if (codeEl) {
        codeEl.textContent = 'Pulsa «Copiar Código» y pega en la consola de Instagram.';
      }
    }

    async function initCopyPage() {
      const copyBtn = document.getElementById('copy-btn');
      instagramScript = await cargarScriptExtractor();

      if (!instagramScript) {
        const codeEl = document.getElementById('code');
        if (codeEl) {
          codeEl.textContent = 'Falta el bundle. Ejecuta: bun run build';
        }
        return;
      }

      mostrarEstadoListo();
      if (copyBtn) {
        copyBtn.disabled = false;
      }
    }

    async function copyToClipboard() {
      if (!instagramScript) {
        return;
      }
      try {
        await navigator.clipboard.writeText(instagramScript);
        overlayControl('show');
      } catch (error) {
        console.error('Failed to copy text:', error);
      }
    }

    function overlayControl(state) {
      const overlay = document.getElementById('overlay');
      if (!overlay) return;

      if (state === 'show') {
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }

    initCopyPage();

    (function () {
      var isFile = location.protocol === 'file:';
      var backLink = document.querySelector('[data-back]');
      if (backLink) {
        backLink.href = isFile ? '../index.html' : '../';
      }
      var analizadorLink = document.querySelector('[data-analizador]');
      if (analizadorLink) {
        analizadorLink.href = isFile ? '../analizador/index.html' : '../analizador/';
      }
    })();
  </script>
  <script src="../assets/version-badge.js"></script>
